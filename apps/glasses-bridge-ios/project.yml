name: GlassesBridge
options:
  bundleIdPrefix: com.dojo
  deploymentTarget:
    iOS: "17.2"   # floor set by the MWDAT frameworks
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Put your Apple team ID here locally (Xcode → Settings → Accounts). A free
    # Personal Team is enough to sideload onto your own phone. Don't commit it.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  # Meta Wearables Device Access Toolkit. Package.swift only exists on tagged
  # releases (not main), and Meta's own sample pins exactVersion — do the same.
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0

targets:
  GlassesBridge:
    type: application
    platform: iOS
    sources:
      - path: GlassesBridge
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      # Mock Device Kit is simulator-only; it is only referenced under
      # `#if DEBUG && targetEnvironment(simulator)` (see Core/MockGlasses.swift).
      - package: MetaWearablesDAT
        product: MWDATMockDevice
    info:
      path: GlassesBridge/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "GlassesBridge streams the glasses camera to the build assistant hub. In the Simulator the phone camera stands in for the glasses."
        NSBluetoothAlwaysUsageDescription: "Needed to connect to your Ray-Ban Meta glasses."
        NSBluetoothPeripheralUsageDescription: "Needed to connect to your Ray-Ban Meta glasses."
        # DAT 0.8+ uses a Wi-Fi link for the camera when it can. MWDATCore's
        # link-availability check wants BOTH keys present and non-empty
        # ("NSBonjourServices must be present and non-empty"); Meta's
        # CameraAccess sample ships exactly these values.
        NSLocalNetworkUsageDescription: "Lets the phone find and connect to the glasses over Wi-Fi, and send frames to the stream hub on your laptop."
        NSBonjourServices: [_bonjour._tcp]
        # --- Meta DAT requirements (mirrors the SDK's getting-started guide) ---
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [glassesbridge]
        LSApplicationQueriesSchemes: [fb-viewapp]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        # `audio` keeps narration playing while the screen is locked; it does
        # NOT keep the camera stream alive (see docs/glasses-bridge.md).
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral, external-accessory, audio]
        MWDAT:
          AppLinkURLScheme: "glassesbridge://"
          # "0" = Developer Mode (enabled in the Meta AI app), which is all a
          # sideloaded build needs. A real MetaAppID from the Wearables
          # Developer Center is only required for release channels.
          MetaAppID: "0"
        # Plain-HTTP hub on the LAN; ws:// needs this in Developer Preview builds.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dojo.glassesbridge
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"

  GlassesBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GlassesBridgeTests
    dependencies:
      - target: GlassesBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dojo.glassesbridge.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  GlassesBridge:
    build:
      targets:
        GlassesBridge: all
        GlassesBridgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [GlassesBridgeTests]
